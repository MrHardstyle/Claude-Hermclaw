# Hermclaw Next – variables shared by every bootstrap role (Bauplan §2, §5, §6).
# Host-specific values (MAC addresses, interfaces) belong in inventory/hosts.yml.
# Override per host/group in the inventory; never put secrets here.

# --- Target platform (1.1, research 20261008-001) ---------------------------
hermclaw_debian_major: "13"
hermclaw_debian_codename: trixie

# --- Identity (1.2) ---------------------------------------------------------
hermclaw_user: hermclaw
hermclaw_group: hermclaw
hermclaw_home: /var/lib/hermclaw
# Login used by the runtime for SSH administration on .222/.223/.224 (research 021).
hermclaw_ssh_runtime_user: hermclaw-admin

# --- Directories (1.3) ------------------------------------------------------
hermclaw_install_dir: /opt/hermclaw
hermclaw_venv: /opt/hermclaw/venv
hermclaw_bin_dir: /opt/hermclaw/bin
hermclaw_config_dir: /etc/hermclaw
hermclaw_ssh_dir: /etc/hermclaw/ssh
hermclaw_data_dir: /var/lib/hermclaw
hermclaw_log_dir: /var/log/hermclaw
hermclaw_credstore_dir: /etc/credstore.encrypted
hermclaw_webroot: /var/www/hermclaw-next

# --- Network (Bauplan §6) ---------------------------------------------------
# hermclaw_orchestrator_ip and hermclaw_lan_broadcast come from the inventory.
hermclaw_api_port: 8000
hermclaw_litellm_port: 4000
hermclaw_postgres_port: 5432
hermclaw_metrics_port: 9100
hermclaw_worker_port: 8787
hermclaw_ollama_port: 11434
hermclaw_searxng_port: 8888

# Port plan per inventory group. scripts/bootstrap/check-host.sh carries the same
# table (tests/integration/test_bootstrap_infra.py keeps both in sync).
# expect = process names (/proc/<pid>/comm) that may legitimately own the port already;
# "name~word" additionally requires word in the command line (generic interpreters).
hermclaw_port_plan:
  orchestrator:
    - {port: 8000, service: hermclaw-api, expect: [hermclaw, python3~hermclaw, python~hermclaw, uvicorn~hermclaw]}
    - {port: 4000, service: litellm, expect: [litellm, python3~litellm, python~litellm]}
    - {port: 5432, service: postgresql, expect: [postgres]}
    - port: 8888
      service: searxng
      expect: [rootlessport, pasta, pasta.avx2, slirp4netns, conmon, uwsgi~searx, granian~searx, python3~searx]
    - {port: 9100, service: metrics, expect: [hermclaw, python3~hermclaw, python~hermclaw]}
  webui:
    - {port: 80, service: nginx-http, expect: [nginx]}
    - {port: 443, service: nginx-https, expect: [nginx]}
  execution_workers:
    - {port: 8787, service: hermclaw-exec-worker, expect: [hermclaw-exec-w, python3~hermclaw, python~hermclaw]}
  model_workers:
    - {port: 8787, service: hermclaw-model-worker, expect: [hermclaw-model-, python3~hermclaw, python~hermclaw]}
    - {port: 11434, service: ollama, expect: [ollama]}

# --- Behaviour switches -----------------------------------------------------
# false = render/configure files only (image or chroot builds); never use to hide failures.
hermclaw_install_packages: true
hermclaw_manage_services: true
hermclaw_timezone: Europe/Berlin
