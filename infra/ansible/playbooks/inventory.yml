# P00 0.4–0.17: read-only inventory of all hosts.
# Usage: ansible-playbook -i infra/ansible/inventory/hosts.yml infra/ansible/playbooks/inventory.yml
# Results land in <hermclaw_inventory_results_dir>/<host>.json on the control node
# (default ./inventory-results relative to the working directory).
# ansible.builtin.script copies the script into Ansible's private per-run temp directory and
# removes it afterwards - nothing is left on the hosts and no predictable /tmp path is used.
- name: Hermclaw read-only host inventory
  hosts: all
  gather_facts: false
  become: false
  vars:
    hermclaw_inventory_results_dir: ./inventory-results
  tasks:
    - name: Create the results directory on the control node
      ansible.builtin.file:
        path: "{{ hermclaw_inventory_results_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Run inventory (read-only)
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../../scripts/inventory/hermclaw-inventory.sh
          --role {{ group_names | join(',') | quote }}
      register: inv
      changed_when: false
      check_mode: false

    - name: Store result on control node
      ansible.builtin.copy:
        content: "{{ inv.stdout }}"
        dest: "{{ hermclaw_inventory_results_dir }}/{{ inventory_hostname }}.json"
        mode: "0640"
      delegate_to: localhost
