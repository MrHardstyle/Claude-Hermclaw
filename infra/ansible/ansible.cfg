# Hermclaw Next – Ansible control-node configuration.
# Run from infra/ansible/ (or set ANSIBLE_CONFIG=infra/ansible/ansible.cfg).
# Only ansible-core (ansible.builtin) is required – no Galaxy collections.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
host_key_checking = true
gathering = smart
forks = 6
nocows = 1

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
