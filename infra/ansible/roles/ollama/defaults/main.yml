# ollama – Ollama server on the model worker .224 (research 20261008-007, recheck 20261014-026).
# Pinned release; upgrade only after the GPU smoke test (INSTALLATION.md 5.6: a short generate,
# `ollama ps` must show 100% GPU).
# 0.40.4 = latest release on 2026-10-14 (2026-10-12; archive sha256 verified in research 026).
# 0.40.3 is the tested fallback (same CUDA runners and driver rule). Before every bump read the
# release notes for "cuda_v12" / "compute capability": Pascal runs on the cuda_v12 runner only.
ollama_version: "0.40.4"
# Gemma 4 needs >= 0.22, Qwen3.8 >= 0.32.12 (research R-007/R-012): never pin below.
ollama_min_version: "0.32.12"
# tarball = pinned release archive (checksum verified) under /opt/ollama/<version>
# script  = official install script with OLLAMA_VERSION (installs /usr/local/bin/ollama)
ollama_install_method: tarball
ollama_release_base: https://github.com/ollama/ollama/releases/download
ollama_archive: ollama-linux-amd64.tar.zst
ollama_install_script_url: https://ollama.com/install.sh
ollama_install_root: /opt/ollama
ollama_bin: >-
  {{ (ollama_install_root ~ '/current/bin/ollama') if ollama_install_method == 'tarball'
     else '/usr/local/bin/ollama' }}
ollama_download_dir: /var/cache/hermclaw

ollama_user: ollama
ollama_group: ollama
ollama_home: /var/lib/ollama          # only used when the account does not exist yet
# empty = Ollama's default below the account's home (<home>/.ollama/models; an existing
# account keeps its home and therefore its downloaded models)
ollama_models_dir: ""

# Server settings (systemd drop-in ollama.service.d/hermclaw.conf)
ollama_listen: "0.0.0.0:{{ hermclaw_ollama_port }}"
ollama_keep_alive: 5m
ollama_max_loaded_models: 2        # one large model + the embedding model
ollama_num_parallel: 1
# Flash attention: "false" renders OLLAMA_FLASH_ATTENTION=0 (unset would mean "auto", which on
# compute capability 6.1 already enables it), "true" renders 1 (only after the GPU smoke test),
# "auto" leaves it to Ollama.
ollama_flash_attention: "false"
# KV cache quantisation: "" = Ollama default (f16); q8_0/q4_0 need flash attention enabled.
ollama_kv_cache_type: ""
ollama_load_timeout: 10m           # 18-19 GB partial-offload loads on a cold page cache
ollama_no_cloud: true              # OLLAMA_NO_CLOUD=1: no remote inference/web search
ollama_vulkan: false               # OLLAMA_VULKAN=0: deterministic CUDA path, no silent fallback
# Further OLLAMA_* variables (validated allowlist, never OLLAMA_CONTEXT_LENGTH).
ollama_extra_env: {}

# Ollama has no authentication and listens on the LAN (OLLAMA_HOST=0.0.0.0): a dedicated
# nftables table (hermclaw-ollama-firewall.service) drops connections to the Ollama port
# from everything except loopback and these sources (the orchestrator runs LiteLLM and the
# health checks). Other tables/rules are never touched. Add sources (IPv4/IPv6, CIDR
# allowed) for existing LAN clients instead of disabling it.
ollama_firewall_enabled: true
ollama_firewall_allowed_sources:
  - "{{ hermclaw_orchestrator_ip }}"
ollama_firewall_nft_file: "{{ hermclaw_config_dir }}/nftables/hermclaw-ollama.nft"
ollama_firewall_nft_bin: /usr/sbin/nft
ollama_firewall_port: "{{ ollama_listen.split(':')[-1] }}"   # taken from ollama_listen

# Verify the API after (re)start
ollama_verify: true
# After (re)start, the GPU discovery in the journal of the current ollama.service invocation
# must report an "inference compute" device of this library (fails on "NVIDIA driver too old"
# or a CPU-only result). Empty = no GPU check (hosts without a GPU).
ollama_expected_gpu_library: CUDA
ollama_gpu_check_retries: 20
ollama_gpu_check_delay: 3

# llama.cpp next to Ollama (D-015): one resident llama-server on the model host serves the chat roles whose profile
# says `backend: llamacpp` (experts of the MoE model in RAM via --n-cpu-moe, attention and KV cache on the GPU:
# ~2x prefill and decode of Ollama's layer split on the 8 GB GTX 1080, measured 2026-10-17). It reads the GGUF from
# Ollama's model store, so the model is pulled once with `ollama pull` (ollama_llamacpp_model is an Ollama tag).
# The archive comes from scripts/ops/build-llamacpp.sh on the control node.
ollama_llamacpp_enabled: false
ollama_llamacpp_build: b11361
ollama_llamacpp_archive_src: ""            # control-node path of llamacpp-<build>-sm61.tgz
ollama_llamacpp_archive_sha256: ""         # its sha256 (printed by build-llamacpp.sh)
ollama_llamacpp_install_root: /opt/llamacpp
ollama_llamacpp_model: "qwen3.6:35b"       # Ollama tag; also the name llama-server serves (--alias)
ollama_llamacpp_port: 18080
ollama_llamacpp_context: 32768
ollama_llamacpp_n_cpu_moe: 30              # MoE layers whose experts stay in RAM (lower = more on the GPU; 26 OOMs at 32K)
ollama_llamacpp_threads: 6
ollama_llamacpp_flash_attention: "on"
ollama_llamacpp_extra_args: []             # further llama-server arguments (validated allowlist)
# preset values of the main model ({<llama-server option without dashes>: <value>}, as ollama_llamacpp_models[].settings;
# R-034, e.g. {ubatch-size: 1024}); in single-model mode they become `--<option> <value>` (`true`: the bare flag)
ollama_llamacpp_model_settings: {}
ollama_llamacpp_health_retries: 60         # x 5 s: a cold page cache loads ~20 GB from disk
# Further models the same llama-server serves on demand (router mode, `--models-max 1`): a request names the model,
# the server unloads the loaded one and loads the requested one (the RAM of the model host holds one large model).
# Each entry: {model: <Ollama tag, also the served name>, settings: {<llama-server option without dashes>: <value>}};
# the main model keeps -ngl 99/--n-cpu-moe and loads at start. Example (R-033: the planner on a dense model that
# --fit splits between GPU and CPU): [{model: "qwen3.8:27b", settings: {fit: "on"}}]. A model outside Ollama's store
# (coder tournament candidates, 2026-10-20) names its GGUF: {model: "ornith-1.5:35b", path: /var/lib/hcbench/models/x.gguf}
ollama_llamacpp_models: []
