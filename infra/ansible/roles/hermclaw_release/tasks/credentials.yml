# 32.8 – every credential a unit loads (LoadCredentialEncrypted=<id>:<path>) must exist before the unit is
# enabled: an absolute path makes a missing file fatal at start (status 243/CREDENTIALS), and LiteLLM would even
# fall back to "no auth" without its key (research 20261014-027 L9). The unit files on the host are the truth.
# Input: hermclaw_release_credential_units (unit names below hermclaw_release_systemd_dir).
- name: Check for the unit files
  ansible.builtin.stat:
    path: "{{ hermclaw_release_systemd_dir }}/{{ item }}"
    get_checksum: false
  loop: "{{ hermclaw_release_credential_units }}"
  register: hermclaw_release_cred_unit_stat

- name: Require the unit files installed by the bootstrap (systemd_skeleton)
  ansible.builtin.assert:
    that: hermclaw_release_cred_unit_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      {{ hermclaw_release_cred_unit_stat.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
      not installed in {{ hermclaw_release_systemd_dir }} on {{ inventory_hostname }} - run playbooks/bootstrap.yml first.
    quiet: true

- name: Read the unit files
  ansible.builtin.slurp:
    src: "{{ hermclaw_release_systemd_dir }}/{{ item }}"
  loop: "{{ hermclaw_release_credential_units }}"
  register: hermclaw_release_cred_unit_raw

- name: Collect the credentials the units load
  ansible.builtin.set_fact:
    hermclaw_release_unit_credentials: >-
      {% set out = [] %}{% for r in hermclaw_release_cred_unit_raw.results %}{% for m in (r.content | b64decode)
      | regex_findall('(?m)^LoadCredentialEncrypted=([^:\s]+):(/\S+)\s*$') %}{% set _ = out.append({'unit': r.item,
      'name': m[0], 'path': m[1]}) %}{% endfor %}{% endfor %}{{ out }}

- name: Check the credential files
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
  loop: "{{ hermclaw_release_unit_credentials }}"
  loop_control:
    label: "{{ item.unit }}: {{ item.name }}"
  register: hermclaw_release_cred_files

- name: Collect missing credentials
  ansible.builtin.set_fact:
    hermclaw_release_missing_credentials: >-
      {{ hermclaw_release_cred_files.results | rejectattr('stat.exists') | map(attribute='item') | list }}

- name: Stop before a unit would start without its credentials
  ansible.builtin.fail:
    msg: |-
      {{ inventory_hostname }}: {{ hermclaw_release_missing_credentials | length }} credential(s) missing - nothing has been deployed.
      {% for c in hermclaw_release_missing_credentials %}
      * {{ c.unit }} loads '{{ c.name }}' from {{ c.path }}, which does not exist.
      {% if c.name == 'gitlab-token' %}
        The GitLab token is issued by you (GitLab .226: project or group access token, role Developer, scopes api,
        read_repository, write_repository). Store it on {{ inventory_hostname }} as root - it is read from stdin,
        encrypted with systemd-creds and never echoed or logged:
          sudo {{ hermclaw_bin_dir }}/hermclaw-credential set gitlab-token
          sudo {{ hermclaw_bin_dir }}/hermclaw-credential check gitlab-token      # OK gitlab-token
      {% elif c.name == 'worker-token' %}
        The worker token is copied from the orchestrator by the bootstrap: run playbooks/bootstrap.yml for the
        orchestrator, then for {{ inventory_hostname }} (--limit).
      {% elif c.name in ['api-admin-token', 'litellm-master-key'] or c.name is match('^worker-token-') %}
        Generated by the bootstrap (systemd_skeleton_generate_credentials): re-run playbooks/bootstrap.yml for
        {{ inventory_hostname }}, or create it as root: sudo {{ hermclaw_bin_dir }}/hermclaw-credential generate {{ c.name }}
      {% else %}
        Create it as root (secret from stdin): sudo {{ hermclaw_bin_dir }}/hermclaw-credential set {{ c.name }}
        (a random secret: ... generate {{ c.name }}).
      {% endif %}
      {% endfor %}
  when: hermclaw_release_missing_credentials | length > 0

- name: Check that every credential decrypts on this host (prints OK/FAIL only, never the value)
  ansible.builtin.command:
    argv: ["{{ hermclaw_bin_dir }}/hermclaw-credential", check, "{{ item.name }}"]
  environment:
    HERMCLAW_CREDSTORE_DIR: "{{ item.path | dirname }}"
  loop: "{{ hermclaw_release_unit_credentials | unique(attribute='path') }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  check_mode: false
  when:
    - hermclaw_release_check_credentials_decrypt | bool
    - item.path | basename == 'hermclaw-' ~ item.name
