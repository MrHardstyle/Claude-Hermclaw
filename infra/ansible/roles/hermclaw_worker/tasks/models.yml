# 32.6 – the Ollama tags of the enabled models.yaml profiles on this model host (roles fixed: Gemma planner,
# Qwen3-Coder 30B coder, Qwen3.8 27B heavy reviewer, Qwen3 8B fast router, EmbeddingGemma). Missing tags are pulled
# by the release's hermclaw-model-pull in a transient unit (hermclaw-model-pull.service) that Ansible polls, with the
# worker daemon stopped (main.yml runs this before it starts the daemon).
- name: Decide the model tags of this host
  ansible.builtin.set_fact:
    hermclaw_worker_profiles: >-
      {{ hermclaw_config_data.models.profiles | rejectattr('enabled', 'defined') | list
         + (hermclaw_config_data.models.profiles | selectattr('enabled', 'defined') | selectattr('enabled') | list) }}

# A model the llama.cpp router serves from a GGUF file (ollama_llamacpp_models[].path, coder tournament candidates)
# is not an Ollama tag: pulling it failed the deploy for lack of disk space (rc62).
- name: Collect the wanted tags
  vars:
    hermclaw_worker_file_models: >-
      {{ ollama_llamacpp_models | default([]) | selectattr('path', 'defined') | map(attribute='model') | list }}
  ansible.builtin.set_fact:
    hermclaw_worker_wanted_models: >-
      {{ (hermclaw_worker_profiles
          | selectattr('host', 'undefined') | map(attribute='model') | list
          + (hermclaw_worker_profiles | selectattr('host', 'defined')
             | selectattr('host', 'equalto', systemd_skeleton_worker_id | default(hermclaw_worker_id)) | map(attribute='model') | list))
         | unique | reject('in', hermclaw_worker_file_models) | sort }}
    hermclaw_worker_embedding_model: >-
      {{ (hermclaw_worker_profiles | selectattr('role', 'equalto', 'embedding') | map(attribute='model') | list + [''])[0] }}
    hermclaw_worker_planner_fallback: >-
      {{ hermclaw_worker_profiles | selectattr('role', 'equalto', 'planner_fallback') | list | length > 0 }}

- name: Require plain Ollama tags (they become arguments of ollama pull)
  ansible.builtin.assert:
    that: hermclaw_worker_bad_tags | length == 0
    fail_msg: "models.yaml names invalid Ollama tags: {{ hermclaw_worker_bad_tags }}"
    quiet: true
  vars:
    hermclaw_worker_bad_tags: >-
      {{ hermclaw_worker_wanted_models | reject('match', '^[a-z0-9][a-z0-9._/-]*(:[A-Za-z0-9][A-Za-z0-9._-]*)?$') | list }}

- name: List the installed models
  ansible.builtin.command:
    argv: ["{{ hermclaw_worker_ollama_bin }}", list]
  environment:
    OLLAMA_HOST: "{{ hermclaw_worker_ollama_url }}"
  register: hermclaw_worker_ollama_list
  changed_when: false
  check_mode: false

- name: Find the missing tags
  ansible.builtin.set_fact:
    hermclaw_worker_missing_models: >-
      {%- set installed = hermclaw_worker_ollama_list.stdout_lines[1:] | map('split') | map('first') | list -%}
      {{ hermclaw_worker_wanted_models | reject('in', installed)
         | reject('in', installed | map('regex_replace', ':latest$', '') | list) | list }}

- name: Pull the missing models
  when: hermclaw_worker_missing_models | length > 0
  block:
    - name: Read the models directory from the Ollama drop-in
      ansible.builtin.slurp:
        src: "{{ hermclaw_worker_ollama_dropin }}"
      register: hermclaw_worker_dropin

    - name: Measure the free space of the models directory
      ansible.builtin.command:
        argv:
          - df
          - --block-size=1G
          - --output=avail
          - "{{ (hermclaw_worker_dropin.content | b64decode | regex_search('(?m)^Environment=OLLAMA_MODELS=(\\S+)$', '\\1')
                 | default(['/var/lib/ollama'], true))[0] }}"
      register: hermclaw_worker_df
      changed_when: false
      check_mode: false

    - name: Require enough disk space for the download
      ansible.builtin.assert:
        that: (hermclaw_worker_df.stdout_lines[-1] | trim | int) >= hermclaw_worker_need_gb | float
        fail_msg: >-
          {{ hermclaw_worker_missing_models | join(', ') }} need about {{ hermclaw_worker_need_gb }} GB (download sizes +
          {{ hermclaw_worker_model_disk_headroom_gb }} GB headroom), {{ hermclaw_worker_df.stdout_lines[-1] | trim }} GB
          are free on the models directory. Free disk space or move OLLAMA_MODELS (ollama_models_dir), then re-run.
        quiet: true
      vars:
        hermclaw_worker_need_gb: >-
          {%- set total = namespace(gb=hermclaw_worker_model_disk_headroom_gb | float) -%}{%- for tag in hermclaw_worker_missing_models
          -%}{%- set total.gb = total.gb + (hermclaw_worker_model_sizes_gb[tag] | default(hermclaw_worker_model_default_size_gb) | float)
          -%}{%- endfor -%}{{ total.gb | round(1) }}

    # Downloads take hours. A running daemon heartbeats "ready", and the scheduler suspends an idle ready worker after
    # wake_on_lan.idle_after_minutes - in the middle of the download. Without heartbeats the worker goes offline and is
    # never suspended; main.yml starts the daemon again right after the pulls.
    - name: Stop the worker daemon during the download (the scheduler never suspends an offline worker)
      ansible.builtin.command:  # noqa: command-instead-of-module
        argv: [systemctl, stop, "{{ hermclaw_worker_unit }}"]
      changed_when: true
      when: not ansible_check_mode

    - name: Check for a model pull that is still running
      ansible.builtin.command:
        argv: [systemctl, is-active, hermclaw-model-pull.service]
      register: hermclaw_worker_pull_active
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Forget the result of an earlier failed pull
      ansible.builtin.command:
        argv: [systemctl, reset-failed, hermclaw-model-pull.service]
      register: hermclaw_worker_pull_reset
      changed_when: false
      failed_when: false
      when: hermclaw_worker_pull_active.stdout | trim not in ['active', 'activating']

    - name: Start hermclaw-model-pull as a transient unit
      ansible.builtin.command:
        argv: >-
          {{ ['systemd-run', '--unit=hermclaw-model-pull', '--description=Hermclaw model pull (playbooks/deploy.yml)',
              '--setenv=OLLAMA_HOST=' ~ hermclaw_worker_ollama_url, '--property=TimeoutStartSec=infinity',
              hermclaw_bin_dir ~ '/hermclaw-model-pull', '--ollama', hermclaw_worker_ollama_bin]
             + ([] if hermclaw_worker_planner_fallback | bool else ['--skip-fallback-planner'])
             + (['--embedding', hermclaw_worker_embedding_model] if hermclaw_worker_embedding_model | length > 0 else []) }}
      changed_when: true
      when: hermclaw_worker_pull_active.stdout | trim not in ['active', 'activating']

    - name: Wait for the model pull (polls, survives a dropped SSH session)
      ansible.builtin.command:
        argv: [systemctl, is-active, hermclaw-model-pull.service]
      register: hermclaw_worker_pull_state
      until: hermclaw_worker_pull_state.stdout | trim not in ['active', 'activating']
      retries: "{{ (hermclaw_worker_model_pull_timeout | int / hermclaw_worker_model_pull_poll | int) | round(0, 'ceil') | int }}"
      delay: "{{ hermclaw_worker_model_pull_poll | int }}"
      changed_when: false
      failed_when: false
      check_mode: false

    - name: List the installed models after the pull
      ansible.builtin.command:
        argv: ["{{ hermclaw_worker_ollama_bin }}", list]
      environment:
        OLLAMA_HOST: "{{ hermclaw_worker_ollama_url }}"
      register: hermclaw_worker_ollama_after
      changed_when: false
      check_mode: false

    # hermclaw-model-pull pulls the fixed role set (and the embedding/fallback planner given above); a tag that
    # models.yaml names differently (hermclaw_config_overrides.models) is pulled here, one transient unit per tag
    - name: Find the tags of models.yaml that hermclaw-model-pull did not pull
      ansible.builtin.set_fact:
        hermclaw_worker_extra_models: >-
          {%- set installed = hermclaw_worker_ollama_after.stdout_lines[1:] | map('split') | map('first') | list -%}
          {{ hermclaw_worker_wanted_models | reject('in', installed)
             | reject('in', installed | map('regex_replace', ':latest$', '') | list) | list }}

    - name: Pull the remaining tags of models.yaml
      ansible.builtin.include_tasks:
        file: pull_tag.yml
        apply:
          tags: [hermclaw_worker]
      loop: "{{ hermclaw_worker_extra_models }}"
      loop_control:
        loop_var: hermclaw_worker_tag
      when: not ansible_check_mode

    - name: List the installed models after all pulls
      ansible.builtin.command:
        argv: ["{{ hermclaw_worker_ollama_bin }}", list]
      environment:
        OLLAMA_HOST: "{{ hermclaw_worker_ollama_url }}"
      register: hermclaw_worker_ollama_final
      changed_when: false
      check_mode: false

    - name: Find tags that are still missing
      ansible.builtin.set_fact:
        hermclaw_worker_still_missing: >-
          {%- set installed = hermclaw_worker_ollama_final.stdout_lines[1:] | map('split') | map('first') | list -%}
          {{ hermclaw_worker_wanted_models | reject('in', installed)
             | reject('in', installed | map('regex_replace', ':latest$', '') | list) | list }}

    - name: Read the log of the model pulls
      ansible.builtin.command:
        argv: [journalctl, --unit=hermclaw-model-pull.service, --unit=hermclaw-model-pull-tag.service, --lines=40, --no-pager, --output=cat]
      register: hermclaw_worker_pull_log
      changed_when: false
      check_mode: false
      when:
        - hermclaw_worker_still_missing | length > 0
        - not ansible_check_mode

    # a dry run pulls nothing, so the tags are still missing there: it only reports what the real run would pull
    - name: Require every model of models.yaml
      ansible.builtin.assert:
        that: hermclaw_worker_still_missing | length == 0
        fail_msg: >-
          still missing on {{ inventory_hostname }}: {{ hermclaw_worker_still_missing | join(', ') }}
          (hermclaw-model-pull: {{ hermclaw_worker_pull_state.stdout | default('?') | trim }}). Last log lines:
          {{ hermclaw_worker_pull_log.stdout_lines | default([]) | join(' | ') | truncate(1500) }}
          - pull by hand: sudo OLLAMA_HOST={{ hermclaw_worker_ollama_url }} {{ hermclaw_worker_ollama_bin }} pull <tag>
        quiet: true
      when: not ansible_check_mode
