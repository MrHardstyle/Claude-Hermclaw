# 32.5 / 32.9 – LiteLLM right after its (re)start, before the API and the scheduler start: alive, and refusing
# requests without the master key. Any failure stops the play (the drained services stay stopped).
- name: Wait for LiteLLM (/health/liveliness)
  ansible.builtin.uri:
    url: "{{ hermclaw_orchestrator_litellm_url }}/health/liveliness"
    return_content: true
  register: hermclaw_orchestrator_litellm_live
  until: hermclaw_orchestrator_litellm_live.status == 200
  retries: "{{ hermclaw_orchestrator_health_retries }}"
  delay: "{{ hermclaw_orchestrator_health_delay }}"
  check_mode: false
  when: not ansible_check_mode

# without its master key LiteLLM silently runs without authentication (research 20261014-027 L9/L10): an
# unauthenticated request must be refused (401; 500 = the prisma package is missing in the venv, still refused)
- name: Check that LiteLLM refuses requests without the master key
  ansible.builtin.uri:
    url: "{{ hermclaw_orchestrator_litellm_url }}/v1/models"
    status_code: [200, 400, 401, 403, 500]
  register: hermclaw_orchestrator_litellm_noauth
  check_mode: false
  when: not ansible_check_mode

- name: Require authentication at LiteLLM
  ansible.builtin.assert:
    that: hermclaw_orchestrator_litellm_noauth.status != 200
    fail_msg: >-
      LiteLLM serves /v1/models without a key: it runs without its master key (LITELLM_MASTER_KEY empty?).
      Check the credential: sudo {{ hermclaw_bin_dir }}/hermclaw-credential check litellm-master-key
    quiet: true
  when: not ansible_check_mode
