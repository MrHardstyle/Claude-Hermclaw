# 32.9 – health of the API right after the (re)start; any failure stops the play (LiteLLM is checked before the
# API and the scheduler start: health_litellm.yml). The complete installation check (`hermclaw doctor`, workers,
# models, sandbox, research) runs in the last play (hermclaw_verify).
- name: Wait for the API (/api/health reports status ok and version {{ hermclaw_version }})
  ansible.builtin.uri:
    url: "{{ hermclaw_orchestrator_api_url }}/api/health"
    return_content: true
    status_code: [200, 503]
  register: hermclaw_orchestrator_api_health
  until: >-
    hermclaw_orchestrator_api_health.status == 200
    and hermclaw_orchestrator_api_health.json.status | default('') == 'ok'
    and hermclaw_orchestrator_api_health.json.version | default('') == hermclaw_version
  retries: "{{ hermclaw_orchestrator_health_retries }}"
  delay: "{{ hermclaw_orchestrator_health_delay }}"
  check_mode: false
  when: not ansible_check_mode
