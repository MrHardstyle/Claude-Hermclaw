# Encrypted systemd credentials in {{ hermclaw_credstore_dir }} (research 20261008-020).
# Plaintext never reaches logs: generation happens on the host itself; the shared worker
# tokens pass through Ansible only with no_log and are re-encrypted with the worker's key.
- name: Install the credential helper
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../scripts/bootstrap/hermclaw-credential.sh"
    dest: "{{ hermclaw_bin_dir }}/hermclaw-credential"
    owner: root
    group: root
    mode: "0750"

- name: Determine the credentials this host's units load
  ansible.builtin.set_fact:
    systemd_skeleton_host_credentials: >-
      {{ ((('orchestrator' in group_names) | ternary(
              systemd_skeleton_credentials.api + systemd_skeleton_credentials.scheduler
              + systemd_skeleton_credentials.litellm
              + (systemd_skeleton_worker_ids | map('regex_replace', '^', 'worker-token-') | list), []))
          + ((group_names | intersect(['execution_workers', 'model_workers']) | length > 0)
              | ternary(systemd_skeleton_credentials.worker, []))) | unique }}

- name: Generate Hermclaw-defined secrets on the orchestrator
  ansible.builtin.command:
    argv: ["{{ hermclaw_bin_dir }}/hermclaw-credential", generate, "{{ item }}"]
    creates: "{{ hermclaw_credstore_dir }}/hermclaw-{{ item }}"
  environment:
    HERMCLAW_CREDSTORE_DIR: "{{ hermclaw_credstore_dir }}"
  loop: >-
    {{ systemd_skeleton_generated_credentials
       + (systemd_skeleton_worker_ids | map('regex_replace', '^', 'worker-token-') | list) }}
  when:
    - "'orchestrator' in group_names"
    - systemd_skeleton_generate_credentials | bool

- name: Hand the worker token to this worker
  when:
    - group_names | intersect(['execution_workers', 'model_workers']) | length > 0
    - systemd_skeleton_generate_credentials | bool
    - groups['orchestrator'] | default([]) | length > 0
    - not ansible_check_mode
  block:
    - name: Check for the local worker token
      ansible.builtin.stat:
        path: "{{ hermclaw_credstore_dir }}/hermclaw-worker-token"
      register: systemd_skeleton_worker_token

    - name: Check for this worker's token on the orchestrator
      ansible.builtin.stat:
        path: "{{ hermclaw_credstore_dir }}/hermclaw-worker-token-{{ systemd_skeleton_worker_id }}"
      delegate_to: "{{ groups['orchestrator'][0] }}"
      register: systemd_skeleton_orch_worker_token
      when: not systemd_skeleton_worker_token.stat.exists

    # the decryption below runs with no_log, so a missing source must be reported here
    - name: Require the orchestrator to be bootstrapped first
      ansible.builtin.fail:
        msg: >-
          {{ hermclaw_credstore_dir }}/hermclaw-worker-token-{{ systemd_skeleton_worker_id }} does not exist on
          {{ groups['orchestrator'][0] }} - bootstrap the orchestrator first
          (ansible-playbook playbooks/bootstrap.yml --limit orchestrator), then rerun for {{ inventory_hostname }}.
      when:
        - not systemd_skeleton_worker_token.stat.exists
        - not systemd_skeleton_orch_worker_token.stat.exists

    - name: Decrypt the worker token on the orchestrator
      ansible.builtin.command:
        argv:
          - systemd-creds
          - decrypt
          - "--name=worker-token-{{ systemd_skeleton_worker_id }}"
          - "{{ hermclaw_credstore_dir }}/hermclaw-worker-token-{{ systemd_skeleton_worker_id }}"
          - "-"
      delegate_to: "{{ groups['orchestrator'][0] }}"
      register: systemd_skeleton_worker_token_plain
      changed_when: false
      no_log: true
      when: not systemd_skeleton_worker_token.stat.exists

    - name: Store the worker token encrypted for this host
      ansible.builtin.command:
        argv: ["{{ hermclaw_bin_dir }}/hermclaw-credential", set, worker-token]
        stdin: "{{ systemd_skeleton_worker_token_plain.stdout_lines | first }}"
      environment:
        HERMCLAW_CREDSTORE_DIR: "{{ hermclaw_credstore_dir }}"
      no_log: true
      changed_when: true
      when: not systemd_skeleton_worker_token.stat.exists

- name: Check which credentials exist
  ansible.builtin.stat:
    path: "{{ hermclaw_credstore_dir }}/hermclaw-{{ item }}"
  loop: "{{ systemd_skeleton_host_credentials }}"
  register: systemd_skeleton_cred_stat

- name: Collect missing credentials
  ansible.builtin.set_fact:
    systemd_skeleton_missing_credentials: >-
      {{ systemd_skeleton_cred_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}

- name: Report missing credentials
  ansible.builtin.debug:
    msg: >-
      Missing credentials on {{ inventory_hostname }}: {{ systemd_skeleton_missing_credentials }} -
      create them with `{{ hermclaw_bin_dir }}/hermclaw-credential set <name>` before enabling the units.
  when: systemd_skeleton_missing_credentials | length > 0

- name: Require all credentials before enabling units
  ansible.builtin.assert:
    that: systemd_skeleton_missing_credentials | length == 0
    fail_msg: "cannot enable units, credentials missing: {{ systemd_skeleton_missing_credentials }}"
    quiet: true
  when: systemd_skeleton_enable_units | bool
