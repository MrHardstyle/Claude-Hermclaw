- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: hermclaw_manage_services | bool

- name: Reload the hermclaw user manager
  ansible.builtin.command:
    argv: [systemctl, --user, "--machine={{ hermclaw_user }}@.host", daemon-reload]
  changed_when: true
  when: hermclaw_manage_services | bool

- name: Restart SearXNG
  ansible.builtin.command:
    argv: [systemctl, --user, "--machine={{ hermclaw_user }}@.host", try-restart, hermclaw-searxng.service]
  changed_when: true
  when: hermclaw_manage_services | bool
