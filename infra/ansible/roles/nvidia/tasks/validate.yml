# Input validation of the nvidia role (tested locally by
# tests/integration/test_bootstrap_infra.py::test_role_input_validation).
- name: Validate NVIDIA settings
  ansible.builtin.assert:
    that:
      - nvidia_driver_branch is match('^[0-9]{3}$')
      - nvidia_driver_branch | int < 590
      - nvidia_source in ['runfile', 'cuda', 'debian']
      - nvidia_runfile_version is match('^[0-9]{3}[.][0-9]{1,3}([.][0-9]{1,3})?$')
      - nvidia_runfile_version.split('.')[0] == nvidia_driver_branch
      - nvidia_runfile_sha256 | length == 0 or nvidia_runfile_sha256 is match('^[0-9a-f]{64}$')
      - nvidia_runfile_base is match('^https://[A-Za-z0-9./_-]+$')
      - nvidia_cuda_repo_base is match('^https://[A-Za-z0-9./_-]+$')
      - nvidia_runfile_download_dir is match('^/[A-Za-z0-9._/-]+$')
      - "'/../' not in nvidia_runfile_download_dir ~ '/'"
      # installer options: plain long options only (they end up on a root command line)
      - nvidia_runfile_options | reject('match', '^--[a-z0-9-]+(=[A-Za-z0-9._/-]+)?$') | list | length == 0
      - nvidia_runfile_options | map('trim') | list == nvidia_runfile_options | list
      - "'--kernel-module-type=open' not in nvidia_runfile_options"
      - nvidia_persistenced_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - nvidia_persistenced_bin is match('^/[A-Za-z0-9._/-]+$')
    fail_msg: >-
      invalid NVIDIA settings: Pascal (GTX 1080) needs a driver branch below 590 (default 580) with the
      proprietary kernel modules, source runfile/cuda/debian, a runfile version of that branch, an optional
      64-hex SHA-256 and https download locations
    quiet: true
