# nginx – webroot and the Hermclaw site on .223 (P01 1.12, P32 32.7: headers/CSP, optional TLS)
- name: Validate the nginx settings
  ansible.builtin.import_tasks: validate.yml
  tags: [nginx]

# policy-rc.d 101: the package's maintainer scripts never start nginx (Debian's default site would try port 80,
# which another web server may own on a shared host); the role starts it below, after its own checks.
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    install_recommends: false
    policy_rc_d: 101
  when: hermclaw_install_packages | bool
  tags: [nginx, packages]

# A fresh install links sites-enabled/default (listen 80 default_server, [::]:80) and enables nginx.service: on a
# shared host it would compete with the other web server for port 80 at every boot.
- name: Disable nginx's Debian default site on a shared host
  ansible.builtin.import_tasks: default_site.yml
  when: nginx_disable_debian_default_site | bool
  tags: [nginx]

- name: Create the webroot
  ansible.builtin.file:
    path: "{{ hermclaw_webroot }}"
    state: directory
    owner: "{{ nginx_webroot_owner }}"
    group: "{{ nginx_webroot_group }}"
    mode: "0755"
  tags: [nginx]

- name: Place a placeholder page (never overwrites a deployed UI)
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ hermclaw_webroot }}/index.html"
    owner: "{{ nginx_webroot_owner }}"
    group: "{{ nginx_webroot_group }}"
    mode: "0644"
    force: false
  tags: [nginx]

- name: Refuse to overwrite a foreign site with the same name
  ansible.builtin.include_tasks:
    file: guard.yml
    apply:
      tags: [nginx]
  tags: [nginx]

# Debian's nginx package ships both directories and includes sites-enabled/* from
# nginx.conf; they are (re)created only for image builds without the package.
- name: Ensure the Debian site directories exist
  ansible.builtin.file:
    path: "/etc/nginx/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [sites-available, sites-enabled]
  tags: [nginx]

- name: Check that nginx.conf loads sites-enabled
  ansible.builtin.import_tasks: sites_include.yml
  when: hermclaw_install_packages | bool
  tags: [nginx]

- name: TLS certificate and key
  ansible.builtin.import_tasks: tls.yml
  when: nginx_tls_enabled | bool
  tags: [nginx, tls]

- name: Install and validate the site
  tags: [nginx]
  block:
    - name: Write the Hermclaw site
      ansible.builtin.template:
        src: hermclaw-next.conf.j2
        dest: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: nginx_site
      notify: Reload nginx

    - name: Enable the Hermclaw site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}.conf"
        state: link
      register: nginx_link
      notify: Reload nginx

    - name: Test the complete nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t, -q]
      changed_when: false
      when:
        - hermclaw_install_packages | bool
        - not ansible_check_mode

    # `nginx -t` accepts a listen on a port another process owns (EADDRINUSE is tolerated in test mode): on a shared
    # host every listen directive of the complete configuration is checked against the reserved ports.
    - name: Check the listeners of the complete configuration
      ansible.builtin.import_tasks: listeners.yml
      when:
        - nginx_reserved_ports | length > 0
        - hermclaw_install_packages | bool
        - not ansible_check_mode

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started
      when: hermclaw_manage_services | bool
  rescue:
    - name: Restore the previous site file
      ansible.builtin.copy:
        src: "{{ nginx_site.backup_file }}"
        dest: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: nginx_site.backup_file is defined

    - name: Disable a newly added site that breaks nginx
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ nginx_site_name }}.conf"
        state: absent
      when:
        - nginx_link is defined
        - nginx_link is changed

    - name: Stop after the rollback
      ansible.builtin.fail:
        msg: >-
          Installing the Hermclaw site failed in '{{ ansible_failed_task.name | default('?') }}':
          {{ ansible_failed_result.msg | default('') | truncate(400) }}{{ (' ' ~ (ansible_failed_result.stderr | default('') | truncate(400))) }}
          - previous site configuration restored, the running nginx was not reloaded.

- name: Firewall (ufw) rules for the nginx ports
  ansible.builtin.import_tasks: firewall.yml
  tags: [nginx, firewall]

# a changed site or a disabled default site takes effect now, so the live check below sees the new listeners
- name: Apply pending nginx changes
  ansible.builtin.meta: flush_handlers
  tags: [nginx]

- name: Check the live listeners of nginx on a shared host
  ansible.builtin.import_tasks: live_listeners.yml
  when:
    - nginx_reserved_ports | length > 0
    - hermclaw_manage_services | bool
    - not ansible_check_mode
  tags: [nginx]
