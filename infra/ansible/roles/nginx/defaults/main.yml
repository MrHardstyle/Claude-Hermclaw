# nginx – presentation control plane on .223 (P01 1.12; research 20261008-014).
# One site template for the bootstrap and the deployment (P32 32.7): SSE proxy, security headers + CSP for the
# static build, optional TLS. Both playbooks render the same file (site.yml stays idempotent).
nginx_site_name: hermclaw-next
nginx_server_name: "{{ hermclaw_web_server_name | default('_') }}"
# HTTP port of the site: hermclaw_webui_http_port of playbooks/group_vars/all.yml (8080 on the shared .223, D-013);
# 80 when the role runs without the playbooks' variables. Set hermclaw_webui_http_port (host var) rather than this
# one: hosts.yaml, the port plan and the portal button read it too (a host var nginx_listen_port is honoured as well).
nginx_listen_port: "{{ hermclaw_webui_http_port | default(80) }}"
# Also listen on [::] (IPv6). Default: only when the host has an IPv6 address - nginx refuses to
# start with `listen [::]:...` on a kernel without IPv6 (ipv6.disable=1, "Address family not supported").
nginx_listen_ipv6: "{{ ansible_facts['all_ipv6_addresses'] | default([]) | length > 0 }}"
# Only claim default_server when no other site does (never take over existing sites).
nginx_default_server: false

# --- Shared host (D-013: .223 keeps the legacy portal on Apache) ----------------------------------------------
# nginx then runs next to another web server: the ports below are never listened on (validate.yml refuses them as
# nginx_listen_port/nginx_tls_port, and after writing the site the complete configuration - `nginx -T` - and,
# once nginx runs, the live sockets are checked for them), nginx's own Debian default site (listen 80
# default_server) is disabled before nginx starts for the first time, and HSTS is refused (it covers every port
# of the host name, the portal included).
nginx_shared_host: "{{ hermclaw_webui_shared_host | default(false) }}"
nginx_reserved_ports: "{{ [80, 443] if nginx_shared_host | bool else [] }}"
# Remove /etc/nginx/sites-enabled/default, but only while it is the package's symlink to sites-available/default
# (the file itself, a conffile, stays; any other site is never touched).
nginx_disable_debian_default_site: "{{ nginx_shared_host | bool }}"
nginx_debian_default_site_link: /etc/nginx/sites-enabled/default
nginx_debian_default_site_file: /etc/nginx/sites-available/default
# live listener check after a start or reload (a reload only signals nginx): attempts and seconds between them
nginx_listener_check_retries: 10
nginx_listener_check_delay: 1
# Sources (IPv4/IPv6 CIDR or address) for which an ACTIVE ufw gets "allow proto tcp from <source> to any port
# <nginx ports>". Default on a shared host: the host's own IPv4 LAN (network/prefix of its default route, e.g.
# 192.168.178.0/24), so an existing inventory needs no edit; elsewhere []. Empty = the firewall is never touched:
# with an active ufw and no rule that allows the ports the role then stops on a shared host (the portal button
# would lead nowhere) and warns on a dedicated one. ufw is never enabled, reset or reloaded and no other rule is
# changed.
nginx_firewall_allow_from: >-
  {{ [ansible_facts['default_ipv4']['network'] ~ '/' ~ ansible_facts['default_ipv4']['prefix']]
     if (nginx_shared_host | bool and ansible_facts['default_ipv4']['network'] | default('') | length > 0
         and ansible_facts['default_ipv4']['prefix'] | default('') | string | length > 0)
     else [] }}
nginx_ufw_bin: /usr/sbin/ufw
nginx_api_upstream: "http://{{ hermclaw_orchestrator_ip }}:{{ hermclaw_api_port }}"
nginx_client_max_body_size: 64m
nginx_sse_read_timeout: 3600s
nginx_webroot_owner: root
nginx_webroot_group: www-data
# Main configuration that must include sites-enabled/ (Debian layout).
nginx_main_conf_path: /etc/nginx/nginx.conf

# --- Security headers (research 20261014-028 A7, A10-A12) ------------------------------------------------------
# The Vite build has no inline script/style (scripts/deploy/build-release.sh refuses inline <script>); previews are
# blob: URLs. With TLS on, upgrade-insecure-requests is appended. No double quotes or line breaks.
nginx_csp: >-
  default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:;
  font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self';
  frame-ancestors 'none'; object-src 'none'
nginx_permissions_policy: "camera=(), microphone=(), geolocation=(), usb=()"

# --- TLS (optional) ---------------------------------------------------------------------------------------------
# On: port nginx_tls_port serves the site (HTTP/2), port nginx_listen_port only /healthz and a 301 to HTTPS.
nginx_tls_enabled: false
# hermclaw_webui_https_port of playbooks/group_vars/all.yml (8443 on the shared .223), 443 without it.
nginx_tls_port: "{{ hermclaw_webui_https_port | default(443) }}"
# self-signed = key + certificate generated on the host (ECDSA P-256, SAN = server names + address, renewed 30 days
# before expiry); provided = nginx_tls_cert_src / nginx_tls_key_src copied from the control node (e.g. your LAN CA,
# research 20261014-028 "TLS with an internal CA").
nginx_tls_source: self-signed
nginx_tls_cert_src: ""
nginx_tls_key_src: ""
nginx_tls_dir: /etc/nginx/tls
nginx_tls_cert: "{{ nginx_tls_dir }}/hermclaw-web.crt"
nginx_tls_key: "{{ nginx_tls_dir }}/hermclaw-web.key"
# <= 397 days: accepted by every current browser/OS for a server certificate
nginx_tls_self_signed_days: 397
nginx_tls_san: >-
  {{ ((nginx_server_name.split() | reject('equalto', '_') | reject('search', '[*~]')
       | map('regex_replace', '^([0-9.]+)$', 'IP:\1') | map('regex_replace', '^(?!IP:)', 'DNS:') | list)
      + (['IP:' ~ ansible_host] if ansible_host | default('') is match('^[0-9.]+$') else [])) | unique }}
# Strict-Transport-Security max-age (seconds) - only once every client trusts the certificate; 0 = not sent.
# Refused on a shared host (nginx_shared_host): HSTS applies to the host name on every port.
nginx_hsts_max_age: 0
