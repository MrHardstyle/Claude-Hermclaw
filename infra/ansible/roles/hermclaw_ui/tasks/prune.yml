# Keep the active UI build and the hermclaw_keep_releases most recently active others, ordered by their completion
# markers <version>.release (unpacking and every switch to or away from a build touch it; the build directories carry
# the archive's fixed mtime). Only entries named after a release version are considered.
- name: Read the active UI build
  ansible.builtin.stat:
    path: "{{ hermclaw_webroot }}"
    follow: false
    get_checksum: false
  register: hermclaw_ui_active

- name: Find the unpacked UI builds
  ansible.builtin.find:
    paths: ["{{ hermclaw_ui_releases_dir }}"]
    patterns: ["^{{ hermclaw_version_pattern }}$"]
    use_regex: true
    file_type: directory
  register: hermclaw_ui_builds

- name: Find the UI build markers
  ansible.builtin.find:
    paths: ["{{ hermclaw_ui_releases_dir }}"]
    patterns: ["^{{ hermclaw_version_pattern }}\\.release$"]
    use_regex: true
    file_type: file
  register: hermclaw_ui_markers

- name: Decide which UI builds to keep
  ansible.builtin.set_fact:
    hermclaw_ui_keep: >-
      {%- set active = (hermclaw_ui_active.stat.lnk_target | default('') | basename)
         if hermclaw_ui_active.stat.islnk | default(false) else hermclaw_version -%}
      {%- set others = hermclaw_ui_markers.files | sort(attribute='mtime', reverse=true)
         | map(attribute='path') | map('basename') | map('regex_replace', '\.release$', '') | reject('equalto', active) | list -%}
      {{ ([active, hermclaw_version] + others[:hermclaw_keep_releases | int]) | unique }}

- name: Delete pruned UI builds and their markers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (hermclaw_ui_builds.files + hermclaw_ui_markers.files) | map(attribute='path')
       | reject('in', hermclaw_ui_keep | map('regex_replace', '^', hermclaw_ui_releases_dir ~ '/') | list)
       | reject('in', hermclaw_ui_keep | map('regex_replace', '^(.*)$', hermclaw_ui_releases_dir ~ '/\1.release') | list) | list }}
