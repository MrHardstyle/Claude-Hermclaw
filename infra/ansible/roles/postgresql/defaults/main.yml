# postgresql – PostgreSQL 17 + pgvector from PGDG on the orchestrator (P01 1.7, 1.8;
# research 20261008-003, DECISIONS D-002). Debian's own pgvector 0.8.0 is affected by
# CVE-2026-3172 and CVE-2026-103484, therefore pgvector comes from PGDG (>= 0.8.7, floor 0.8.2).
postgresql_version: "17"
postgresql_cluster: main
postgresql_port: "{{ hermclaw_postgres_port }}"
# Hard floor, can never be lowered: CVE-2026-3172 (parallel HNSW build; Hermclaw builds HNSW indexes).
postgresql_pgvector_min_version: "0.8.2"
# Required by default: CVE-2026-103484 (GHSA-pw7q-9788-x566, IVFFlat index build -> code execution, fixed in 0.8.7;
# research 20261014-027 P11). Hermclaw creates no IVFFlat index. If PGDG has no 0.8.7 build for trixie yet, accept
# 0.8.2-0.8.6 explicitly with postgresql_pgvector_accept_below_recommended: true and update as soon as it exists
# (`hermclaw doctor` keeps warning).
postgresql_pgvector_recommended_version: "0.8.7"
postgresql_pgvector_accept_below_recommended: false
postgresql_pgvector_required_version: >-
  {{ postgresql_pgvector_min_version
     if (postgresql_pgvector_accept_below_recommended | bool
         or postgresql_pgvector_min_version is version(postgresql_pgvector_recommended_version, '>='))
     else postgresql_pgvector_recommended_version }}

postgresql_pgdg_uri: https://apt.postgresql.org/pub/repos/apt
postgresql_pgdg_suite: "{{ hermclaw_debian_codename }}-pgdg"
postgresql_pgdg_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc

postgresql_packages:
  - "postgresql-{{ postgresql_version }}"
  - "postgresql-client-{{ postgresql_version }}"
  - "postgresql-{{ postgresql_version }}-pgvector"

# Database owned by the service account; services connect over the Unix socket with
# peer authentication (no password exists for the role).
postgresql_db_name: hermclaw
postgresql_db_owner: "{{ hermclaw_user }}"
postgresql_extensions:
  - vector

# Never published on the LAN (Bauplan §6: "lokal/privat").
postgresql_listen_addresses: localhost
postgresql_settings:
  max_connections: 100
  shared_buffers: 2GB
  effective_cache_size: 8GB
  maintenance_work_mem: 512MB
  work_mem: 16MB
  password_encryption: scram-sha-256
  log_line_prefix: "%m [%p] %q%u@%d "
  log_min_duration_statement: 2000
  lock_timeout: 0
  idle_in_transaction_session_timeout: 600000

# Additional pg_hba lines (type, database, user, address, method). They are evaluated
# after the postgres and Hermclaw rules and before the generic local rules (first match wins).
postgresql_hba_extra: []

# Debian layout of the cluster (pg_createcluster): server binaries and configuration directory.
postgresql_bin_dir: "/usr/lib/postgresql/{{ postgresql_version }}/bin"
postgresql_conf_dir: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}"
