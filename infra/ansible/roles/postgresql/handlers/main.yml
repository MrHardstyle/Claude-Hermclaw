- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}"
    state: restarted
  when: hermclaw_manage_services | bool

- name: Reload postgresql
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}"
    state: reloaded
  when: hermclaw_manage_services | bool
