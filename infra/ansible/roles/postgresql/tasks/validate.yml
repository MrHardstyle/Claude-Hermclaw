# Input validation of the postgresql role (tested locally by
# tests/integration/test_bootstrap_infra.py::test_role_input_validation).
- name: Validate database identifiers and the listen address
  ansible.builtin.assert:
    that:
      - postgresql_db_name is match('^[a-z_][a-z0-9_]{0,62}$')
      - postgresql_db_owner is match('^[a-z_][a-z0-9_-]{0,62}$')
      - postgresql_version | string is match('^[0-9]{2}$')
      - postgresql_cluster is match('^[a-z0-9_-]+$')
      - postgresql_extensions | select('match', '^[a-z_][a-z0-9_]*$') | list | length == postgresql_extensions | length
      - postgresql_restore_template is match('^[a-z_][a-z0-9_]{0,62}$')
      - postgresql_restore_template not in [postgresql_db_name, 'postgres', 'template0', 'template1']
      - postgresql_listen_addresses in ['localhost', '127.0.0.1', '::1', '127.0.0.1,::1']
      - postgresql_pgvector_min_version is version('0.8.2', '>=')
      - postgresql_pgvector_recommended_version is version('0.8.7', '>=')
    fail_msg: >-
      invalid PostgreSQL settings (identifiers, a non-local listen address, a pgvector minimum
      below 0.8.2 (CVE-2026-3172) or a recommended pgvector below 0.8.7 (CVE-2026-103484))
    quiet: true

# Extra pg_hba rules: no trust/password/md5 methods, no injected fields or line breaks.
- name: Validate additional pg_hba rules
  ansible.builtin.assert:
    that:
      - item.type | default('') in ['local', 'host', 'hostssl']
      - item.database | default('') is match('^[A-Za-z0-9_+,.-]+$')
      - item.user | default('') is match('^[A-Za-z0-9_+,.-]+$')
      - item.method | default('') in ['peer', 'scram-sha-256', 'reject']
      - (item.type == 'local' and item.address | default('') | length == 0)
        or (item.type != 'local' and item.address | default('') is match('^[0-9A-Fa-f:.]+/[0-9]{1,3}$'))
    fail_msg: >-
      invalid postgresql_hba_extra rule {{ item }} (type local/host/hostssl, method
      peer/scram-sha-256/reject, CIDR address for host rules)
    quiet: true
  loop: "{{ postgresql_hba_extra }}"
  loop_control:
    label: "{{ item.type | default('?') }} {{ item.database | default('?') }} {{ item.user | default('?') }}"
