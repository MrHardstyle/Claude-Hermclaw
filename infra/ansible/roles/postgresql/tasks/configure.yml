- name: List PostgreSQL clusters
  ansible.builtin.command:
    argv: [pg_lsclusters, --no-header]
  register: postgresql_clusters
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the cluster if it is missing
  ansible.builtin.command:
    argv:
      - pg_createcluster
      - --port={{ postgresql_port }}
      - --encoding=UTF8
      - --locale=C.UTF-8
      - "{{ postgresql_version }}"
      - "{{ postgresql_cluster }}"
    creates: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}/postgresql.conf"
  when: postgresql_clusters.rc == 0

- name: Find the cluster line
  ansible.builtin.set_fact:
    postgresql_cluster_line: >-
      {{ postgresql_clusters.stdout_lines | default([])
         | select('match', '^' ~ postgresql_version ~ ' +' ~ postgresql_cluster ~ ' ') | first | default('') }}

- name: Assert the cluster uses the planned port (never take over a foreign cluster)
  ansible.builtin.assert:
    that: (postgresql_cluster_line.split() + ['', '', ''])[2] == postgresql_port | string
    fail_msg: >-
      Cluster {{ postgresql_version }}/{{ postgresql_cluster }} is configured for port
      {{ (postgresql_cluster_line.split() + ['', '', ''])[2] }} instead of {{ postgresql_port }}
      (another PostgreSQL already owns the port?). Resolve manually (pg_lsclusters) - no automatic change.
    quiet: true
  when: postgresql_cluster_line | length > 0

- name: Ensure the conf.d directory exists
  ansible.builtin.file:
    path: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
  when: not ansible_check_mode or postgresql_cluster_line | length > 0

- name: Write the Hermclaw settings drop-in
  ansible.builtin.template:
    src: hermclaw.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}/conf.d/hermclaw.conf"
    owner: postgres
    group: postgres
    mode: "0644"
    backup: true
  register: postgresql_conf
  notify: Restart postgresql

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
    backup: true
  register: postgresql_hba
  notify: Reload postgresql

- name: Enable and start the cluster
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}"
    enabled: true
    state: started
  when: hermclaw_manage_services | bool

- name: Validate configuration files before they are applied
  ansible.builtin.import_tasks: validate_config.yml
  when:
    - hermclaw_manage_services | bool
    - not ansible_check_mode

- name: Apply configuration changes now
  ansible.builtin.meta: flush_handlers
