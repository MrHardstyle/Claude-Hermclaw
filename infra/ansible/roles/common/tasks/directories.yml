# 1.3 – directory layout (Bauplan §2, §35; research 20261008-020)
- name: Create Hermclaw directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ common_directories }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create worker state directory
  ansible.builtin.file:
    path: "{{ hermclaw_data_dir }}/worker"
    state: directory
    owner: "{{ hermclaw_user }}"
    group: "{{ hermclaw_group }}"
    mode: "0750"
  when: group_names | intersect(['execution_workers', 'model_workers']) | length > 0
