# 1.5 / 1.6 – Debian 13 python3 (3.13) plus venv tooling
- name: Install Python and build tooling
  ansible.builtin.apt:
    name: "{{ common_python_packages }}"
    state: present
    install_recommends: false
  when: hermclaw_install_packages | bool

- name: Read the Python version
  ansible.builtin.command:
    argv:
      - "{{ common_python_bin }}"
      - -c
      - "import sys; print('%d.%d.%d' % sys.version_info[:3])"
  register: common_python_version
  changed_when: false
  check_mode: false

- name: Assert Python >= {{ common_python_min_version }}
  ansible.builtin.assert:
    that: common_python_version.stdout is version(common_python_min_version, '>=')
    fail_msg: "python3 {{ common_python_version.stdout }} is older than {{ common_python_min_version }}"
    quiet: true

# After the first deployment (P32, playbooks/deploy.yml) hermclaw_venv is a symlink to the active release venv
# (venv-<version>); the bootstrap then leaves it alone and only checks that the active release works.
- name: Inspect the application virtualenv path
  ansible.builtin.stat:
    path: "{{ hermclaw_venv }}"
    follow: false
    get_checksum: false
  register: common_venv_path

- name: Create the application virtualenv (owned by root, read-only for services)
  ansible.builtin.command:
    argv:
      - "{{ common_python_bin }}"
      - -m
      - venv
      - "{{ hermclaw_venv }}"
    creates: "{{ hermclaw_venv }}/bin/python"
  when:
    - common_create_venv | bool
    - not common_venv_path.stat.islnk | default(false)

- name: Check that the virtualenv works
  ansible.builtin.command:
    argv:
      - "{{ hermclaw_venv }}/bin/python"
      - -c
      - "import sys, venv; assert sys.prefix != sys.base_prefix"
  register: common_venv_check
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - common_create_venv | bool
    - not (ansible_check_mode and not common_venv_path.stat.exists)

- name: Require a working virtualenv
  ansible.builtin.assert:
    that: common_venv_check.rc == 0
    fail_msg: >-
      {{ hermclaw_venv }}{{ (' -> ' ~ common_venv_path.stat.lnk_target) if common_venv_path.stat.islnk | default(false) else '' }}
      does not work ({{ common_venv_check.stderr | default(common_venv_check.msg | default('')) | trim | truncate(300) }})
      - {{ 'the active release venv is broken or was removed: re-run playbooks/deploy.yml'
           if common_venv_path.stat.islnk | default(false) else 'remove it and re-run the bootstrap' }}.
    quiet: true
  when: common_venv_check is not skipped
