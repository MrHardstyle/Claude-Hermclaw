- id: R3-lua
  title: Lua – rechner interpreter
  base_branch: acceptance/empty
  limit_minutes: 150
  prompt: |-
    Schreibe in Lua 5.4 das Kommandozeilenprogramm `rechner.lua` (im Wurzelverzeichnis, keine externen Rocks).
    Das Programm führt ein kleines Rechenprogramm aus einer Textdatei (UTF-8) aus.
    - Aufruf: `lua rechner.lua DATEI` (genau ein Argument).
    - Jede Zeile ist leer, ein Kommentar (erstes Zeichen außer Leerzeichen und Tabs ist `#`), `let NAME = AUSDRUCK` oder
      `print AUSDRUCK`. Zeilenenden sind LF oder CRLF, die letzte Zeile darf ohne Zeilenende enden. Zwischen den Tokens
      stehen beliebig viele Leerzeichen und Tabs, auch keine (`print(4)`).
    - Tokens: ganze Zahlen aus den Ziffern `0-9`, Namen `[a-z_][a-z0-9_]*` (außer `let` und `print`), die Operatoren
      `+ - * / % ^`, runde Klammern und `=`.
    - Grammatik der Ausdrücke, genau so:
          ausdruck := term (("+" | "-") term)*
          term     := faktor (("*" | "/" | "%") faktor)*
          faktor   := "-" faktor | potenz
          potenz   := basis ("^" faktor)?
          basis    := ZAHL | NAME | "(" ausdruck ")"
      Also `2^3^2` = 512, `-2^2` = -4, `2*-3` = -6, `10-4-3` = 3.
    - Alle Werte sind vorzeichenbehaftete 64-Bit-Ganzzahlen. `/` teilt ganzzahlig und schneidet Richtung null ab
      (`-7/2` = -3), `%` ist der Rest dazu mit dem Vorzeichen des Dividenden (`-7%2` = -1, `7%-2` = 1). `^` potenziert
      mit einem Exponenten ab 0 (`0^0` = 1); auch bei riesigen Exponenten kommt das Ergebnis sofort, wenn es in 64 Bit
      passt (`(-1)^9223372036854775807` = -1).
    - `let` weist einer Variablen einen Wert zu (erneute Zuweisung erlaubt), `print` gibt den Wert als Dezimalzahl in
      einer eigenen Zeile auf stdout aus.
    - Das Programm prüft zuerst die Syntax aller Zeilen und führt erst danach die Anweisungen der Reihe nach aus.
    - Syntaxfehler → Exit-Code 2, nichts auf stdout, auf stderr `Zeile N, Spalte M: <Meldung>`. N ist die Zeilennummer in
      der Datei ab 1, M die Spalte ab 1 des ersten Zeichens des Tokens, an dem der Fehler erkannt wird (ein Tab zählt als
      eine Spalte); fehlt am Zeilenende etwas, ist M die Länge der Zeile ohne Zeilenende plus 1. Beginnt eine Zeile nicht
      mit `let` oder `print`, ist M die Spalte ihres ersten Tokens. Eine Zahl größer als 9223372036854775807 ist ein
      Syntaxfehler an ihrer Spalte, auch nach einem Minus.
    - Laufzeitfehler → Exit-Code 3 und auf stderr eine Meldung mit `Zeile N`: Überlauf des 64-Bit-Bereichs bei jeder
      Operation (auch Negation, Potenz und `-9223372036854775808 / -1`; `-9223372036854775808 % -1` ist dagegen 0),
      Division oder Rest durch null, unbekannte Variable, negativer Exponent. Die Ausgaben der Zeilen davor bleiben auf
      stdout, danach wird nichts mehr ausgeführt.
    - Datei fehlt oder ist nicht lesbar → Exit-Code 1 und eine Meldung mit dem Dateipfad. Falsche Anzahl an Argumenten →
      Exit-Code 4.
    Sichere das Verhalten mit busted-Tests unter `spec/` ab und beschreibe Aufruf und Sprache kurz im `README.md`.
  expected_changes:
  - '*.lua'
  - spec/*
  - README.md
  - .busted
  hidden:
    dir: R3-lua
    image: lua
    command: RC_CMD="lua rechner.lua" bash _hidden/check.sh
    timeout_seconds: 900
