# Language learning ladder, stage R2 (2026-10-28): the same small command line program in every sandbox language –
# a cash book CSV summary with exact cents, calendar dates, CRLF, ordinal sorting, a month filter and exit codes.
# Graded by one language-neutral hidden script (hidden/R2-*/check.sh, TAP) against the built program. System runs
# only; one language at a time and never next to a tournament on the model host:
#
#   sudo -u hermclaw hermclaw coder-tournament /var/lib/hermclaw/tournament/languages-r2.yaml \
#        --model system --task R2-rust --reps 1 --out /var/lib/hermclaw/tournament/ladder-r2-rust
repository: hermclaw-test
hidden_root: hidden
models:
- system
defaults:
  reps: 1
  limit_minutes: 120
tasks:
- id: R2-rust
  title: Rust – kassenbuch command line program
  base_branch: acceptance/empty
  limit_minutes: 120
  prompt: |-
    Schreibe in Rust das Kommandozeilenprogramm `kassenbuch` (Cargo-Paket `kassenbuch` im Wurzelverzeichnis, Binärprogramm `kassenbuch`, keine externen Crates).
    Das Programm liest ein Kassenbuch als CSV-Datei (UTF-8) und gibt die Summen je Kategorie aus.
    - Aufruf: `kassenbuch DATEI [--monat JJJJ-MM]`.
    - Die erste Zeile ist genau `datum;kategorie;betrag`. Jede weitere Zeile hat genau drei Felder, getrennt durch
      `;`: ein gültiges Kalenderdatum `JJJJ-MM-TT` (Schaltjahre beachten), eine Kategorie (Leerzeichen am Rand werden
      entfernt, danach nicht leer) und einen Betrag in Euro mit Dezimalkomma: optional `-`, Ziffern, optional `,` und
      genau zwei Ziffern (`12,50`, `-3`, `1234567,89`; kein Tausenderpunkt). Leere Zeilen werden übersprungen,
      Zeilenenden sind LF oder CRLF, die letzte Zeile darf ohne Zeilenende enden.
    - Ausgabe auf stdout (UTF-8): eine Zeile `Kategorie: Summe` je Kategorie, sortiert ordinal nach dem Namen
      (Codepunkt-Reihenfolge, nicht nach Sprache), danach `GESAMT: Summe`. Summen sind centgenau (keine
      Gleitkomma-Rundungsfehler), mit genau zwei Nachkommastellen, Dezimalkomma und `-` vor negativen Werten, Null
      als `0,00`, z. B. `Miete: -850,00`.
    - `--monat JJJJ-MM` zählt nur Buchungen dieses Monats; passt keine, ist die Ausgabe nur `GESAMT: 0,00`. Geprüft
      werden trotzdem alle Zeilen.
    - Fehler: Datei fehlt oder ist nicht lesbar → Exit-Code 1 und eine Meldung mit dem Dateipfad. Falsche Kopfzeile
      oder ungültige Zeile → Exit-Code 2 und eine Meldung mit `Zeile N` (N ist die Zeilennummer in der Datei, die Kopfzeile ist Zeile 1). Falscher Aufruf
      (keine Datei, unbekannte Option, ungültiger Monat wie `2024-13`) → Exit-Code 3. Fehler gehen nur auf stderr,
      stdout bleibt dann leer.
    Sichere das Verhalten mit Tests ab (`cargo test`) und beschreibe Aufruf und Format kurz im `README.md`.
  expected_changes:
  - Cargo.toml
  - Cargo.lock
  - src/*
  - tests/*
  - README.md
  - .gitignore
  hidden:
    dir: R2-rust
    image: rust
    command: cargo build --offline --release -q >&2; KB_CMD=./target/release/kassenbuch bash _hidden/check.sh
    timeout_seconds: 900
