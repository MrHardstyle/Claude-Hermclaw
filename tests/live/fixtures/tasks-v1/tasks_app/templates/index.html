<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        h1 { text-align: center; }
        #task-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        #task-input { flex: 1; padding: 0.5rem; }
        #task-form button { padding: 0.5rem 1rem; cursor: pointer; }
        #filters { margin-bottom: 1rem; text-align: center; }
        #filters button { margin: 0 0.25rem; padding: 0.25rem 0.75rem; cursor: pointer; }
        #filters button.active { background-color: #007bff; color: white; border-color: #007bff; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-bottom: 1px solid #eee; }
        li.done span { text-decoration: line-through; color: #888; }
        li button { margin-left: auto; padding: 0.25rem 0.5rem; cursor: pointer; }
        .error { color: red; text-align: center; margin: 0.5rem 0; }
    </style>
</head>
<body>
    <h1>Tasks</h1>
    <form id="task-form">
        <input type="text" id="task-input" placeholder="New task" required>
        <button type="submit">Add</button>
    </form>
    <div id="filters">
        <button class="active" data-status="all">All</button>
        <button data-status="open">Open</button>
        <button data-status="done">Done</button>
    </div>
    <div id="error" class="error"></div>
    <ul id="task-list"></ul>
    <script>
        let currentFilter = 'all';
        const taskInput = document.getElementById('task-input');
        const taskForm = document.getElementById('task-form');
        const taskList = document.getElementById('task-list');
        const errorDiv = document.getElementById('error');
        const filterButtons = document.querySelectorAll('#filters button');

        function showError(msg) {
            errorDiv.textContent = msg;
            setTimeout(() => { errorDiv.textContent = ''; }, 3000);
        }

        async function loadTasks() {
            try {
                const res = await fetch(`/api/tasks?status=${currentFilter}`);
                if (!res.ok) throw new Error('Failed to load tasks');
                const tasks = await res.json();
                taskList.innerHTML = '';
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    if (task.done) li.classList.add('done');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = task.done;
                    checkbox.addEventListener('change', () => toggleTask(task.id, !task.done));
                    const span = document.createElement('span');
                    span.textContent = task.title;
                    const delBtn = document.createElement('button');
                    delBtn.textContent = 'Delete';
                    delBtn.addEventListener('click', () => deleteTask(task.id));
                    li.appendChild(checkbox);
                    li.appendChild(span);
                    li.appendChild(delBtn);
                    taskList.appendChild(li);
                });
            } catch (e) {
                showError(e.message);
            }
        }

        async function addTask(title) {
            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Failed to add task');
                }
                taskInput.value = '';
                loadTasks();
            } catch (e) {
                showError(e.message);
            }
        }

        async function toggleTask(id, done) {
            try {
                const res = await fetch(`/api/tasks/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ done: done })
                });
                if (!res.ok) throw new Error('Failed to update task');
                loadTasks();
            } catch (e) {
                showError(e.message);
            }
        }

        async function deleteTask(id) {
            try {
                const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete task');
                loadTasks();
            } catch (e) {
                showError(e.message);
            }
        }

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = taskInput.value.trim();
            if (title) addTask(title);
        });

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.status;
                loadTasks();
            });
        });

        loadTasks();
    </script>
</body>
</html>
