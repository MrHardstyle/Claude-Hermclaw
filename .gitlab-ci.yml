# Hermclaw Next CI (P02 2.9) – runs on GitLab .226 runners (Debian, docker executor).
stages: [lint, test, ui]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  HERMCLAW_TEST_ADMIN_URL: "postgresql://postgres@pgvector:5432/postgres"

.python: &python
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git ripgrep >/dev/null
    - pip install -q -e ".[dev]"

lint:
  <<: *python
  stage: lint
  script:
    - ruff check hermclaw worker tests
    - ruff format --check hermclaw worker tests
    - mypy hermclaw worker

test:
  <<: *python
  stage: test
  services:
    - name: pgvector/pgvector:0.8.2-pg17
      alias: pgvector
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

ui:
  stage: ui
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  script:
    - cd ui && npm ci && npm run lint && npm run typecheck && npm run build && npm test
