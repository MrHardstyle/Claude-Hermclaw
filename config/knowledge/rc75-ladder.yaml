# Operator knowledge from the difficulty ladder on 0.1.0rc73–rc77 (2026-10-23, D-020).
# Import: hermclaw memory-import config/knowledge/rc75-ladder.yaml (existing titles are skipped).
# Every entry names the runs it comes from; edit or retire it on the page "Wissen".

- kind: convention
  title: "Pester: a *.Tests.ps1 file never calls Invoke-Pester or Import-Module Pester – the runner does"
  tags: [powershell, pester, tests]
  content: |
    `Invoke-Pester` discovers every *.Tests.ps1 file and runs it. A test file that calls `Invoke-Pester` itself (for
    example at its end with a configuration) starts discovery again from inside the run: the output repeats
    "Running tests from 1 files." until the command times out, and every run takes minutes.
    `Import-Module Pester -RequiredVersion <x>` in the file fails or loads a second Pester when another version is
    installed. A test file only holds Describe/Context/It blocks; it loads the code under test in BeforeAll
    (`BeforeAll { . "$PSScriptRoot/../Script.ps1" }` – the script must not run its main part when dot-sourced, e.g.
    guard it with `if ($MyInvocation.InvocationName -ne '.') { ... }`) and writes temporary files to `$TestDrive`.
    Run the tests with `pwsh -NoProfile -Command "Invoke-Pester -CI"` from the repository root.
    Seen: ladder A9 #4 on rc73 (coder-main) – two runs of 139 s and 153 s and three timeouts, the step was cancelled.

- kind: convention
  title: "PowerShell: splat parameters with a hashtable – an array splat binds '-Name' strings as positional values"
  tags: [powershell, pester, tests, parameters]
  content: |
    `$a = @('-Status', 'Running'); & ./Script.ps1 @a` does not pass -Status: an array splat binds every element by
    position, so the parameter receives the text "-Status" ("The argument "-Status" does not belong to the set …"),
    and an empty array leaves it unbound. A test helper `param($ArgsList) & $scriptPath @ArgsList` has this bug for
    every call with parameters. Use a hashtable: `$p = @{ Status = 'Running' }; & $scriptPath @p` (an empty `@{}` for
    no parameters), or call the script with named parameters directly: `& $scriptPath -Status Running`.
    Seen: ladder A9 #6 on rc75 (coder-main) – the script was right (hidden checks 9/10), four of its own Pester tests
    failed through such a helper for 30 turns and the job ran out of time.

- kind: convention
  title: "Pester 5+: code outside BeforeAll/It runs only during discovery – set test variables inside BeforeAll"
  tags: [powershell, pester, tests]
  content: |
    Pester runs a test file twice: discovery (top level and Describe/Context bodies) and run (BeforeAll, BeforeEach,
    It). Variables set at the top of the file or in a Describe body during discovery are gone when the It blocks run:
    `$scriptPath = Join-Path $PSScriptRoot '../Script.ps1'` above Describe leaves `& $scriptPath` with nothing ("The
    expression after '&' in a pipeline element produced an object that was not valid"), and every test fails.
    Put such setup in `BeforeAll { $script:scriptPath = Join-Path $PSScriptRoot '..' 'Script.ps1' }` at the top of the
    Describe block, and stubs and mocks in BeforeAll/BeforeEach as well. Run with `Invoke-Pester -CI`: without -CI the
    exit code stays 0 when tests fail.
    Seen: ladder A9 #7 on rc76 (coder-main) – the script was right (hidden checks 9/10), all ten own tests failed for
    three attempts; one run without -CI looked green and the step was completed on it.

- kind: convention
  title: "PowerShell: ConvertTo-Json writes enum properties as numbers – select the fields and convert them to text"
  tags: [powershell, json, enums, tests]
  content: |
    `Get-Service | ConvertTo-Json` (or any object with enum properties) writes `Status` as 4 and `StartType` as 2, not
    "Running"/"Automatic", and it carries every other property of the object as well. Build the output yourself:
    `[PSCustomObject]@{ Name = $_.Name; Status = $_.Status.ToString(); StartType = "$($_.StartType)" }` with exactly
    the fields asked for (`ConvertTo-Json -EnumsAsStrings` exists only in PowerShell 7).
    Tests cannot find this with mocks that return strings: let the mock return the real enum values, e.g.
    `Status = [System.ServiceProcess.ServiceControllerStatus]::Running` (on Linux an `enum` defined in the test with
    the same names works too), and check `$json | Should -Match '"Status":\s*"Running"'`.
    Seen: ladder A9 #8 on rc77 (coder-main) – the script piped the service objects into ConvertTo-Json; the own tests
    mocked Status as text and passed, the hidden check got "Status of Alpha: 4".

- kind: convention
  title: "README: show the call of a delivered script exactly as it is run – with its file name and path"
  tags: [readme, documentation, scripts, powershell, python, shell]
  content: |
    A usage example names the delivered file the way a user types it in the repository: `./Get-Report.ps1 -Status
    Running` or `pwsh -File ./Get-Report.ps1`, `python script.py --flag` or `python -m package`, `./run.sh`. Writing
    only the bare name (`Get-Report -Status Running`) describes a function or a command on PATH, not the script the job
    delivers; a reader cannot run it, and a check that looks for the file name in the README fails. Show one call per
    parameter or option the job names, and the default call without any.
    Seen: ladder A9 #9 on rc77 (coder-main) – the README documented `Get-ServiceReport -Status Running`, the hidden
    check found no `Get-ServiceReport.ps1` in it.
