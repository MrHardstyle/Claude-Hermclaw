# Hermclaw Next – host topology (roles fixed by architecture, Bauplan §2).
# Copy to /etc/hermclaw/hosts.yaml and fill in the real MAC addresses from the inventory.
hosts:
  - id: orchestrator-225
    address: 192.168.178.225
    role: orchestrator
    services:
      - {name: api, port: 8000, http_path: /api/health}
      - {name: litellm, port: 4000, http_path: /health/liveliness}
      - {name: postgresql, port: 5432}
  - id: webui-223
    address: 192.168.178.223
    role: webui
    ssh: {user: hermclaw-admin}
    services:
      # Hermclaw's nginx next to the legacy portal (Apache keeps port 80, D-013); the deployment sets the port from
      # the inventory (hermclaw_webui_http_port) - /healthz answers on it also when TLS is on
      - {name: nginx, port: 8080, http_path: /healthz}
  - id: exec-222
    address: 192.168.178.222
    role: execution_worker
    worker_kind: execution
    worker_api: http://192.168.178.222:8787
    ssh: {user: hermclaw-admin, allow_sudo_commands: ["/usr/bin/systemctl suspend"]}
    idle_sleep_command: "sudo /usr/bin/systemctl suspend"   # idle sleep hook (P10.9); must be in allow_sudo_commands
    labels: {lease_resources: "code-executor-222"}           # leases that count as activity for idle sleep
    wake_on_lan:
      enabled: true
      mac: "00:00:00:00:02:22"          # TODO: replace with real MAC (inventory)
      broadcast: 192.168.178.255
      ping_timeout_seconds: 90
      service_timeout_seconds: 180
    services:
      - {name: worker_api, port: 8787, http_path: /health}
  - id: model-224
    address: 192.168.178.224
    role: model_worker
    worker_kind: model
    worker_api: http://192.168.178.224:8787
    ssh: {user: hermclaw-admin, allow_sudo_commands: ["/usr/bin/systemctl suspend"]}
    idle_sleep_command: "sudo /usr/bin/systemctl suspend"
    labels: {lease_resources: "gpu-224,video-224"}
    wake_on_lan:
      enabled: true
      mac: "00:00:00:00:02:24"          # TODO: replace with real MAC (inventory)
      broadcast: 192.168.178.255
      ping_timeout_seconds: 90
      service_timeout_seconds: 240
    services:
      - {name: worker_api, port: 8787, http_path: /health}
      - {name: ollama, port: 11434, http_path: /api/version}
  - id: gitlab-226
    address: 192.168.178.226
    role: gitlab
    # Git over SSH (clone/fetch/push) uses the orchestrator's runtime key and the pinned known_hosts:
    # key_ref file:/etc/hermclaw/ssh/id_ed25519, known_hosts /etc/hermclaw/ssh/known_hosts (defaults).
    # Not an SSH tool target: gitlab-226 is not in policies.ssh.allowed_hosts.
    ssh: {user: git}
    services:
      - {name: ssh, port: 22}
  - id: terra-60
    address: 192.168.178.60
    role: backup
    ssh: {user: root, key_ref: "file:/etc/hermclaw/ssh/backup_ed25519"}
    services:
      - {name: ssh, port: 22}
